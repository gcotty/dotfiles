# ---------------------------------------------------------------------------
# Colors / terminal capabilities
# ---------------------------------------------------------------------------
# Tell programs inside tmux they have a 256-color terminal...
set -g default-terminal "tmux-256color"
# ...and advertise true-color (24-bit) + undercurl support for the OUTER
# terminal. "xterm-256color" here must match the $TERM your terminal sets.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:usstyle"

# ---------------------------------------------------------------------------
# Prefix — Ctrl+a instead of the default Ctrl+b (easier reach)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press Ctrl+a twice to send a literal Ctrl+a

# ---------------------------------------------------------------------------
# Splits — open in the current pane's directory
#   prefix + |  → split left/right
#   prefix + -  → split top/bottom
# ---------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# new windows also keep the current directory
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Navigation — move between panes with Alt+Arrow (no prefix needed)
# ---------------------------------------------------------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes — prefix + H/J/K/L, repeatable (hold without re-pressing prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Quality of life
# ---------------------------------------------------------------------------
set -g mouse on               # click panes, drag borders, scroll with the wheel
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1     # panes start at 1 too
set -g renumber-windows on    # close a window, the rest renumber
set -g history-limit 50000    # bigger scrollback buffer
set -sg escape-time 10        # snappier ESC (helps vim/neovim inside tmux)
set -g focus-events on        # let editors know when their pane gains focus

# Reload this config without restarting tmux:  prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Copy mode — use vi-style keys (v to select, y to yank)
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Minimal status bar
# ---------------------------------------------------------------------------
set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d  %H:%M "
set -g status-right-length 40
setw -g window-status-current-style "bg=#89b4fa fg=#1e1e2e bold"
